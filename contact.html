<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-left">           
                <a href="index.html">Galleria Photograpica</a>
            </div>
            
            <div class="nav-right">
                <div>
                    <a href="about.html">About</a>
                </div>
                <div>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </nav>
    </header>

    <section class="page-header">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you.</p>
    </section>

    <section class="contact-container">
        <div class="contact-info">
            <h2>Get in Touch!</h2>

            <p>
                <strong>Email:</strong>
                adrian.vidallon@cvsu.edu.ph
            </p>

            <p>
                <strong>Address:</strong>
                Cavite State University, Indang, Cavite
            </p>
        </div>

        <div class="contact-form">
            <h2>Send a Message</h2>

            <form action="#" method="POST">

                <div class="form-group">
                    <label for="name">Full Name: </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address: </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="subject">Subject: </label>
                    <input
                        type="text"
                        id="subject"
                        name="subject"
                    >
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </div>

    </section>        

    </main>

    <footer>
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
